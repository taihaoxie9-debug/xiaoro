<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小 Ro 导购 Demo</title>
  <script src="/static/guide-presentation.js?v=demo-v1"></script>
  <style>
    :root {
      --ink: #302a2f;
      --muted: #796d75;
      --line: #ead9df;
      --rose: #9b6d80;
      --rose-dark: #805267;
      --rose-pale: #fff6f8;
      --paper: #fcf9fa;
      --white: #fff;
      --green: #557c6d;
      --shadow: 0 14px 34px rgba(87, 52, 68, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    button {
      font: inherit;
      cursor: pointer;
    }
    .demo-shell {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 56px;
    }
    .demo-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-end;
      border-bottom: 1px solid var(--line);
      padding: 0 0 18px;
    }
    .eyebrow {
      margin: 0 0 6px;
      color: var(--rose-dark);
      font-size: 13px;
      font-weight: 700;
    }
    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 38px);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .header-note {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }
    .chain-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 18px 0 14px;
    }
    .chain-tab,
    .control-button,
    .feedback-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      color: var(--rose-dark);
      padding: 9px 13px;
    }
    .chain-tab[aria-selected="true"],
    .control-button.primary {
      border-color: var(--rose-dark);
      background: var(--rose-dark);
      color: #fff;
    }
    .demo-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
    }
    .demo-composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      margin-top: 12px;
    }
    .chat-input {
      min-width: 0;
      min-height: 44px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--white);
      outline: none;
    }
    .chat-input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px #f8e9ef;
    }
    .upload-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--rose-dark);
      background: var(--white);
      font-size: 13px;
      cursor: pointer;
    }
    .upload-button input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .progress {
      color: var(--muted);
      font-size: 14px;
    }
    .progress strong {
      color: var(--rose-dark);
    }
    .conversation {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }
    .turn {
      display: grid;
      gap: 10px;
    }
    .user-bubble {
      justify-self: end;
      max-width: min(780px, 92%);
      padding: 12px 15px;
      border-radius: 8px 8px 2px 8px;
      background: #f2e7eb;
      line-height: 1.65;
    }
    .user-image {
      display: block;
      width: min(220px, 100%);
      max-height: 240px;
      margin-bottom: 8px;
      border-radius: 6px;
      object-fit: contain;
      background: #fff;
    }
    .assistant-bubble {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px 8px 8px 2px;
      background: var(--white);
      box-shadow: var(--shadow);
    }
    .assistant-label {
      margin: 0 0 10px;
      color: var(--rose-dark);
      font-size: 13px;
      font-weight: 700;
    }
    .thinking-host {
      min-height: 52px;
    }
    .guide-thinking-pipeline {
      padding: 9px 0 4px;
      color: var(--muted);
    }
    .guide-thinking-stage {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 26px;
      font-size: 14px;
    }
    .guide-thinking-stage-label::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--rose);
      box-shadow: 0 0 0 4px #f6e9ee;
      vertical-align: 1px;
    }
    .guide-thinking-markers {
      display: flex;
      gap: 5px;
      margin-top: 8px;
    }
    .guide-thinking-marker {
      width: 32px;
      height: 3px;
      border-radius: 2px;
      background: #eadfe3;
    }
    .guide-thinking-marker[data-state="done"],
    .guide-thinking-marker[data-state="active"] {
      background: var(--rose);
    }
    .guide-presentation-root {
      display: grid;
      gap: 18px;
    }
    .guide-presentation-section {
      min-width: 0;
    }
    .guide-presentation-section h3 {
      margin: 0 0 8px;
      color: var(--rose-dark);
      font-size: 18px;
      line-height: 1.35;
    }
    .guide-presentation-section p {
      margin: 0;
      line-height: 1.75;
      white-space: pre-wrap;
    }
    .guide-presentation-product > p {
      padding-bottom: 4px;
    }
    .guide-inline-product-card {
      display: flex;
      gap: 14px;
      align-items: center;
      margin: 10px 0 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffafb;
    }
    .guide-inline-product-card a {
      color: inherit;
      text-decoration: none;
    }
    .guide-inline-product-visual img,
    .recommendation-image {
      display: block;
      width: 112px;
      height: 114px;
      object-fit: contain;
      border-radius: 6px;
      background: #fff;
    }
    .guide-inline-product-brand {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }
    .guide-inline-product-name,
    .recommendation-name {
      display: block;
      line-height: 1.45;
    }
    .guide-inline-product-rule {
      display: block;
      width: 42px;
      height: 2px;
      margin: 7px 0;
      background: var(--rose);
    }
    .guide-inline-product-price,
    .recommendation-price {
      color: var(--rose-dark);
      font-weight: 700;
      margin-top: 4px;
    }
    .guide-direct-fact {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid #f0e6e9;
    }
    .guide-direct-fact dt {
      color: var(--muted);
    }
    .guide-direct-fact dd {
      margin: 0;
    }
    .guide-presentation-full-cards {
      padding-top: 4px;
      border-top: 1px solid var(--line);
    }
    .recommendation-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .recommendation-card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    .recommendation-card .recommendation-image {
      width: 100%;
      height: 148px;
      border-radius: 0;
    }
    .recommendation-body {
      padding: 11px 12px 13px;
    }
    .recommendation-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }
    .recommendation-chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border-radius: 5px;
      background: #fff0f4;
      color: var(--rose-dark);
      font-size: 12px;
    }
    .guide-comparison-scroll {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .guide-comparison-table {
      width: 100%;
      min-width: 570px;
      border-collapse: collapse;
      background: #fff;
    }
    .guide-comparison-table th,
    .guide-comparison-table td {
      padding: 11px 12px;
      border-bottom: 1px solid #f0e6e9;
      text-align: left;
      vertical-align: top;
      line-height: 1.5;
    }
    .guide-comparison-table th {
      color: var(--rose-dark);
      font-weight: 700;
    }
    .guide-winner-conclusion {
      padding: 12px 14px;
      border-left: 3px solid var(--rose);
      background: var(--rose-pale);
      line-height: 1.65;
    }
    .guide-winner-conclusion strong {
      color: var(--rose-dark);
    }
    .feedback-row {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
      margin-top: 12px;
    }
    .feedback-button {
      padding: 6px 10px;
      font-size: 13px;
    }
    .feedback-button.active {
      border-color: var(--green);
      color: var(--green);
      background: #f1f8f4;
    }
    .demo-empty {
      padding: 32px 18px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }
    @media (max-width: 680px) {
      .demo-shell { width: min(100% - 20px, 980px); padding-top: 16px; }
      .demo-header { display: block; }
      .demo-toolbar { align-items: flex-start; flex-direction: column; }
      .demo-composer { grid-template-columns: 1fr auto; }
      .upload-button { grid-column: 1 / -1; }
      .recommendation-grid { grid-template-columns: 1fr; }
      .recommendation-card { display: grid; grid-template-columns: 112px minmax(0, 1fr); }
      .recommendation-card .recommendation-image {
        width: 112px;
        height: 128px;
      }
      .assistant-bubble { padding: 14px; }
    }
  </style>
</head>
<body>
  <main class="demo-shell">
    <header class="demo-header">
      <div>
        <p class="eyebrow">小 Ro 导购</p>
        <h1>护肤选购助手</h1>
        <p class="header-note">
          先整理你的肤质和需求，再给出商品建议、追问和对比。
        </p>
      </div>
    </header>

    <nav class="chain-tabs" aria-label="演示链路">
      <button class="chain-tab" type="button" data-chain="text" aria-selected="true">
        推荐 / 追问 / 对比
      </button>
      <button class="chain-tab" type="button" data-chain="image" aria-selected="false">
        图片识别 / 相似 / 肤质判断
      </button>
    </nav>

    <section class="demo-toolbar" aria-label="聊天状态">
      <div class="progress">
        当前链路：<strong id="chainName">推荐 / 追问 / 对比</strong>
        <span> · </span>
        已完成 <strong id="turnNumber">0</strong> 问
      </div>
      <span class="progress" id="uploadStatus"></span>
    </section>

    <form class="demo-composer" id="chatForm">
      <input
        class="chat-input"
        id="chatInput"
        type="text"
        autocomplete="off"
        placeholder="输入你的问题，按发送开始"
      >
      <label class="upload-button" id="uploadButton">
        添加图片
        <input id="imageInput" type="file" accept="image/*">
      </label>
      <button class="control-button primary" id="sendButton" type="submit">
        发送
      </button>
    </form>

    <section class="conversation" id="conversation" aria-live="polite">
      <div class="demo-empty" id="emptyState">
        输入问题后发送。每轮都会先经过思考阶段，再显示小 Ro 的回答和商品卡。
      </div>
    </section>
  </main>

  <script>

      const products = {

      const productSection = (slot, productId, copyText, facts) => section(

          product_id: productId,
          direct_facts: facts

        label,

        copy_source: 'prepared_data',

          section(

          shelf()
        ],
        comparison_rows: [],
        winner: { status: 'not_applicable' },
        visible_product_ids: [53, 102, 54],
        compact_tags: tags([
          [53, '清爽'], [53, '防水'],
          [102, '水感'], [102, '快成膜'], [102, '防晒'],
          [54, '轻薄'], [54, '快干'], [54, '防晒']

      const productKnowledge = {
        mode: 'product_knowledge',
        responsibility: 'product_knowledge',
        copy_source: 'prepared_data',
        sections: [
          section(
            'summary',

          section(
            'product_knowledge',

      const comparison = {
        mode: 'comparison',
        responsibility: 'comparison',
        copy_source: 'prepared_data',
        sections: [

            : '价格待确认';
          return product.specification
            ? `${value} / ${product.specification}`
            : value;

      function appendFeedback(host) {
        const row = document.createElement('div');
        row.className = 'feedback-row';
        row.setAttribute('aria-label', '回答反馈');
        ['有帮助', '需要调整'].forEach(label => {
          const button = document.createElement('button');
          button.className = 'feedback-button';
          button.type = 'button';
          button.textContent = label;
          button.addEventListener('click', () => {
            row.querySelectorAll('button').forEach(item => {
              item.classList.remove('active');
            });
            button.classList.add('active');
          });
          row.appendChild(button);
        });
        host.appendChild(row);
      }

      function appendTurn(turn, inputText, imageUrl) {
        const turnNode = document.createElement('article');
        turnNode.className = 'turn';
        turnNode.dataset.turnIndex = String(cursor);

        const user = document.createElement('div');
        user.className = 'user-bubble';
        if (imageUrl) {
          const image = document.createElement('img');
          image.className = 'user-image';
          image.src = imageUrl;
          image.alt = '用户上传的商品图片';
          user.appendChild(image);
        }
        user.appendChild(document.createTextNode(inputText));

        const assistant = document.createElement('div');
        assistant.className = 'assistant-bubble';
        const label = document.createElement('p');
        label.className = 'assistant-label';
        label.textContent = '小 Ro';
        const thinking = document.createElement('div');
        thinking.className = 'thinking-host';
        assistant.append(label, thinking);
        turnNode.append(user, assistant);
        conversation.appendChild(turnNode);

        const pipeline = P.createThinkingPipeline(thinking, {
          mode: turn.mode,
          autoAdvanceMs: 620
        });
        const stages = P.thinkingStagesForMode(turn.mode);
        const waitMs = Math.max(1800, stages.length * 620 + 280);
        setTimeout(() => {
          if (pipeline) {
            P.advanceThinkingPipeline(
              pipeline,
              stages[stages.length - 1],
              '正在整理你的条件'
            );
          }
          setTimeout(() => {
            if (pipeline) P.dismissThinkingPipeline(pipeline);
            const output = document.createElement('div');
            output.className = 'demo-output';
            assistant.appendChild(output);
            P.renderPresentation(output, turn.state, helpers);
            appendFeedback(assistant);
            running = false;
            chatInput.disabled = false;
            sendButton.disabled = false;
            chatInput.focus();
          }, 300);
        }, waitMs);
      }

      function updateToolbar() {
        const chain = chains[activeChain];
        chainName.textContent = chain.name;
        turnNumber.textContent = String(cursor);
        chatInput.placeholder = activeChain === 'image'
          ? '上传图片后，输入你想问的内容'
          : '输入问题，按发送';
        uploadButton.hidden = activeChain !== 'image';
      }

      function resetChain(nextChain = activeChain) {
        activeChain = nextChain;
        cursor = 0;
        running = false;
        selectedImageUrl = '';
        imageInput.value = '';
        uploadStatus.textContent = '';
        conversation.replaceChildren(emptyState);
        emptyState.hidden = false;
        chatInput.value = '';
        chatInput.disabled = false;
        sendButton.disabled = false;
        updateToolbar();
        document.querySelectorAll('.chain-tab').forEach(tab => {
          tab.setAttribute(
            'aria-selected',
            tab.dataset.chain === activeChain ? 'true' : 'false'
          );
        });
      }

      chatForm.addEventListener('submit', event => {
        event.preventDefault();
        const chain = chains[activeChain];
        const inputText = chatInput.value.trim();
        if (
          running
          || !inputText
          || cursor >= chain.turns.length
          || (activeChain === 'image' && cursor === 0 && !selectedImageUrl)
        ) {
          return;
        }
        if (emptyState.isConnected) emptyState.remove();
        running = true;
        chatInput.disabled = true;
        sendButton.disabled = true;
        const turn = chain.turns[cursor];
        cursor += 1;
        updateToolbar();
        chatInput.value = '';
        appendTurn(turn, inputText, selectedImageUrl);
      });

      imageInput.addEventListener('change', () => {
        const file = imageInput.files?.[0];
        if (!file) return;
        if (selectedImageUrl) URL.revokeObjectURL(selectedImageUrl);
        selectedImageUrl = URL.createObjectURL(file);
        uploadStatus.textContent = `已添加：${file.name}`;
      });

      document.querySelectorAll('.chain-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          if (!running) resetChain(tab.dataset.chain);
        });
      });

      resetChain('text');
