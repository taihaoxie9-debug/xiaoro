<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>保存的京东商品页</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "示例防晒",
        "sku": "100012345678",
        "productID": "100012345678"
      }
    </script>
  </head>
  <body>
    <div class="Ptable">
      <div class="Ptable-item">
        <h3>规格参数</h3>
        <dl>
          <dt>商品名称</dt><dd>示例防晒</dd>
          <dt>防晒指数</dt><dd>SPF50+</dd>
          <dt>适用肤质</dt><dd>敏感肌</dd>
        </dl>
      </div>
    </div>
    <section class="comment-list">
      <h2>用户评价</h2>
      <dl><dt>防晒指数</dt><dd>用户说 SPF30</dd></dl>
    </section>
    <section class="recommend-list">
      <h2>猜你喜欢</h2>
      <dl><dt>商品名称</dt><dd>其他商品</dd></dl>
    </section>
  </body>
</html>
